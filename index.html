<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三七</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #f2f2f7;
      color: #111;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      width: min(92vw, 420px);
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
      text-align: center;
    }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #6e6e73; font-size: 14px; line-height: 1.6; word-break: break-all; }
    a.btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 10px;
      background: #32ade6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="CydiaIcon.png" alt="repo icon">
    <h1>三七</h1>
    <p>在 Sileo 中添加：</p>
    <p>https://aichihongluobudetuzi.github.io/repo/</p>
    <a class="btn" href="sileo://source/https://aichihongluobudetuzi.github.io/repo/">添加到 Sileo</a>
  </div>
</body>
</html>
