name: Update APT repo index

on:
  push:
    branches: [master]
    paths:
      - 'debs/**'
      - 'scripts/update-repo.sh'
      - '.github/workflows/update-repo.yml'
  workflow_dispatch:

concurrency:
  group: update-apt-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dpkg-dev
        run: sudo apt-get update -y && sudo apt-get install -y dpkg-dev

      - name: Rebuild Packages and Release
        run: bash scripts/update-repo.sh

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release
          if git diff --cached --quiet; then
            echo "Index unchanged"
            exit 0
          fi
          git commit -m "chore: rebuild APT index after deb upload"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Purge jsDelivr cache
        if: always()
        run: |
          for f in Release Packages Packages.gz Packages.bz2 CydiaIcon.png CydiaIcon@2x.png CydiaIcon@3x.png sileo-featured.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/aichihongluobudetuzi/repo@master/${f}" || true
          done
